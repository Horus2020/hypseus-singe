name: Windows Debug Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-sdl3-image
            mingw-w64-x86_64-sdl3-mixer
            mingw-w64-x86_64-sdl3-ttf
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-zlib
            autoconf
            automake
            libtool
            git
            make

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -G "MSYS Makefiles" -DDEBUG=ON ../src

      - name: Build
        run: |
          cd build
          make -j2

      - name: Bundle runtime DLLs
        run: |
          cd build
          ldd hypseus.exe | grep mingw64 | awk '{print $3}' | xargs -I{} cp -u {} .
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypseus-debug-windows
          path: 
            build/hypseus.exe
            build/*.dll
